# ── App Under Test — QA environment ────────────────────────────────────────
base.url.qa=https://recoveryclaim-entity-qa.azurewebsites.net
base.url.stage=https://recoveryclaim-entity-staging.azurewebsites.net

login.path=/auth/login

# API base — CONFIRMED LIVE 2026-09-17 by capturing the real Angular app's
# network traffic (form_input login + read_network_requests) while signed in
# as the Claimant Insurer. The app does NOT call its own origin for data —
# every XHR after login goes through this shared Azure API Management
# gateway. Six backend microservices sit behind it, one path segment each,
# matching the six Swagger UIs the framework was built against:
#   claims | inthub | invoice | quotation | settlement | tenant
# e.g. GET {api.gateway.url.qa}/claims/Health, POST {..}/tenant/User/Login
api.gateway.url.qa=https://recovery-api-management-qa.azure-api.net/api
api.gateway.url.stage=https://recovery-api-management-qa.azure-api.net/api

# ── Browser ─────────────────────────────────────────────────────────────────
browser=chromium
headless=true
slowmo.ms=0

# ── Timeouts (seconds unless noted) ─────────────────────────────────────────
explicit.wait.seconds=30
navigation.timeout.seconds=45

